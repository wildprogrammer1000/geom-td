<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a2e1a" />
  <title>결로 — GeomTD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a2418;
      --paper: #f4ead4;
      --ink: #2a2418;
      --muted: #5c6b52;
      --gold: #b8860b;
      --forest: #2d5a3a;
      --stone: #6b6358;
      --cyan: #3a8a7a;
      --amber: #c47a20;
      --violet: #5a6eb8;
      --danger: #a84030;
      --line: rgba(184, 134, 11, 0.28);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --pad-x: max(10px, var(--safe-left), var(--safe-right));
      --pad-y: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(45, 90, 58, 0.35), transparent 55%),
        linear-gradient(180deg, #1a2418 0%, #121a10 100%);
      color: var(--paper);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    .screen { display: none; height: 100%; }
    .screen.active { display: flex; flex-direction: column; }

    /* ── Campaign map ── */
    #screen-campaign {
      padding:
        calc(var(--pad-y) + var(--safe-top))
        var(--pad-x)
        calc(var(--pad-y) + var(--safe-bottom));
      gap: 12px;
    }
    .camp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .camp-header h1 {
      font-family: "Noto Serif KR", serif;
      font-size: 26px;
      letter-spacing: 0.1em;
      color: var(--paper);
    }
    .camp-header .actions { display: flex; gap: 8px; }
    .camp-map {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
      padding: 20px 0;
    }
    .map-connector {
      width: 2px;
      height: 36px;
      background: linear-gradient(180deg, rgba(184,134,11,0.05), rgba(184,134,11,0.45), rgba(184,134,11,0.05));
      flex-shrink: 0;
    }
    .map-node {
      position: relative;
      width: min(280px, 100%);
      min-height: 88px;
      padding: 14px 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 30% 20%, rgba(244,234,212,0.18), transparent 55%),
        linear-gradient(160deg, #3d4a32, #2a3424);
      color: var(--paper);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .map-node:active:not(:disabled) { transform: scale(0.98); }
    .map-node:disabled {
      opacity: 0.42;
      cursor: default;
      filter: grayscale(0.5);
    }
    .map-node .node-title {
      font-family: "Noto Serif KR", serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .map-node .node-desc {
      font-size: 11px;
      color: rgba(244, 234, 212, 0.65);
      margin-top: 4px;
      line-height: 1.4;
    }
    .map-node .node-stars {
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 2px;
      flex-shrink: 0;
    }
    .map-node .lock-icon {
      font-size: 20px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .camp-footer {
      text-align: center;
      font-size: 12px;
      color: rgba(244, 234, 212, 0.55);
      flex-shrink: 0;
    }

    /* ── Shop ── */
    #screen-shop {
      padding:
        calc(var(--pad-y) + var(--safe-top))
        var(--pad-x)
        calc(var(--pad-y) + var(--safe-bottom));
      gap: 14px;
    }
    .shop-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .shop-header h2 {
      font-family: "Noto Serif KR", serif;
      font-size: 22px;
      flex: 1;
      letter-spacing: 0.08em;
      color: var(--paper);
    }
    .shop-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .shop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(160deg, #3d4a32, #2a3424);
      color: var(--paper);
    }
    .shop-row h3 { font-size: 15px; margin-bottom: 4px; color: var(--paper); }
    .shop-row p { font-size: 12px; color: rgba(244, 234, 212, 0.65); line-height: 1.45; }
    .shop-row .badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .shop-row button:not(:disabled) { min-height: 44px; flex-shrink: 0; }
    .shop-bonus {
      text-align: center;
      font-size: 12px;
      color: var(--gold);
      flex-shrink: 0;
    }

    #screen-battle { height: 100%; background: var(--bg); }
    #screen-battle #app { height: 100%; }

    .card .stars {
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 6px;
      margin: 8px 0 12px;
    }
    .card .stars .dim { opacity: 0.22; }
    .card .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card .btn-row button { min-width: 120px; }
    .card .btn-secondary {
      background: #2a3424;
      color: rgba(244, 234, 212, 0.7);
      border-color: var(--line);
    }
    #btn-menu { min-width: 44px; padding: 0 10px; font-size: 18px; }
    .stage-label {
      font-size: 11px;
      color: rgba(244, 234, 212, 0.55);
      letter-spacing: 0.04em;
    }

    /* ── Mobile-first grid (default: phone portrait) ── */
    #app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto auto;
      grid-template-areas:
        "hud"
        "stage"
        "controls"
        "tray"
        "hint";
      padding:
        calc(var(--pad-y) + var(--safe-top))
        var(--pad-x)
        calc(var(--pad-y) + var(--safe-bottom));
      gap: 6px;
    }

    /* panel uses display:contents on mobile so children join the grid */
    .panel { display: contents; }

    .hud-top {
      grid-area: hud;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      min-height: 36px;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-shrink: 0;
    }
    .brand h1 {
      font-family: "Noto Serif KR", "Apple Myungjo", serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--paper);
    }
    .brand .sub {
      font-size: 9px;
      color: rgba(244, 234, 212, 0.55);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hud-stats {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      font-size: 12px;
      font-weight: 600;
      flex-wrap: nowrap;
    }
    .hud-stats span { white-space: nowrap; color: var(--paper); }
    .hud-stats .gold { color: var(--gold); }
    .hud-stats .lives { color: #e08a7a; }
    .hud-stats .wave { color: var(--paper); }

    #stage {
      grid-area: stage;
      position: relative;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 0 0 2px rgba(184, 134, 11, 0.25), 0 18px 40px rgba(0,0,0,0.45);
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
    }
    #tower-panel {
      position: absolute;
      pointer-events: none;
      z-index: 3;
      width: 0;
      height: 0;
      overflow: visible;
    }
    #tower-panel.visible { pointer-events: auto; }
    .up-btn {
      position: absolute;
      background: linear-gradient(180deg, #f4ead4, #e8dcc8);
      border: 1px solid var(--gold);
      color: var(--ink);
      width: 92px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1.15;
      box-shadow: 0 8px 18px rgba(0,0,0,0.45);
      pointer-events: auto;
      padding: 0;
      gap: 1px;
    }
    .up-btn small { font-size: 10px; font-weight: 600; opacity: 0.85; }

    /* ── Tower placement tray ── */
    .tower-tray {
      grid-area: tray;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
      touch-action: none;
    }
    .tray-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 72px;
      padding: 6px 4px 8px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f4ead4, #e8dcc8);
      border: 2px solid rgba(184, 134, 11, 0.35);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      color: var(--ink);
    }
    .tray-item img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .tray-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.1;
      pointer-events: none;
    }
    .tray-cost {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      pointer-events: none;
    }
    .tray-item.single { color: var(--cyan); }
    .tray-item.splash { color: var(--amber); }
    .tray-item.slow { color: var(--violet); }
    .tray-item.selected {
      border-color: var(--gold);
      background: #fff8e8;
      box-shadow: 0 0 0 1px rgba(184, 134, 11, 0.35), inset 0 0 20px rgba(184, 134, 11, 0.08);
    }
    .tray-item.single.selected { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(58,138,122,0.35), inset 0 0 20px rgba(58,138,122,0.08); }
    .tray-item.splash.selected { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(196,122,32,0.35), inset 0 0 20px rgba(196,122,32,0.08); }
    .tray-item.slow.selected { border-color: var(--violet); box-shadow: 0 0 0 1px rgba(90,110,184,0.35), inset 0 0 20px rgba(90,110,184,0.08); }
    .tray-item.cant-afford {
      opacity: 0.38;
      cursor: default;
      filter: grayscale(0.6);
    }
    .tray-item.cant-afford:active { transform: none; }
    .tray-item.dragging { opacity: 0.45; }
    .tray-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 36, 24, 0.72);
      z-index: 5;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      padding: 12px;
    }
    #overlay.hidden { display: none; }
    .card {
      text-align: center;
      padding: 22px 18px;
      max-width: min(300px, 100%);
      background: linear-gradient(180deg, #f4ead4, #e8dcc8);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink);
    }
    .card h2 {
      font-family: "Noto Serif KR", serif;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 0.12em;
      color: var(--ink);
    }
    .card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .card button {
      min-width: 140px;
      min-height: 48px;
      font-size: 16px;
      background: linear-gradient(180deg, #3d4a32, #2d5a3a);
      color: var(--paper);
      border-color: var(--gold);
    }

    .controls-bar {
      grid-area: controls;
      flex-shrink: 0;
    }
    .bar {
      display: flex;
      gap: 8px;
    }
    button {
      font-family: inherit;
      font-weight: 700;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #3d4a32, #2a3424);
      color: var(--paper);
      border-radius: 12px;
      min-height: 44px;
      padding: 0 14px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }
    #btn-wave {
      flex: 1;
      background: linear-gradient(180deg, #4a6b3a, #2d5a3a);
      border-color: rgba(184, 134, 11, 0.5);
      color: var(--paper);
      font-size: 15px;
    }
    #btn-pause, #btn-restart { min-width: 64px; font-size: 13px; color: rgba(244, 234, 212, 0.75); }

    .hint {
      grid-area: hint;
      font-size: 11px;
      color: rgba(244, 234, 212, 0.55);
      text-align: center;
      flex-shrink: 0;
      min-height: 14px;
      line-height: 1.3;
    }

    /* ── Tablet / small laptop (700–1100px) ── */
    @media (min-width: 700px) {
      :root { --pad-x: max(16px, var(--safe-left), var(--safe-right)); --pad-y: 10px; }
      #app { gap: 8px; }
      .brand h1 { font-size: 24px; }
      .brand .sub { font-size: 10px; }
      .hud-stats { font-size: 13px; gap: 12px; }
      .hint { font-size: 12px; }
      .card { padding: 28px 24px; }
      .card h2 { font-size: 32px; }
      .card p { font-size: 14px; }
      #btn-pause, #btn-restart { min-width: 72px; }
      .tray-item { min-height: 80px; }
      .tray-item img { width: 52px; height: 52px; }
    }

    /* ── Desktop (≥1200px): board left, sidebar right ── */
    @media (min-width: 1200px) {
      #app {
        grid-template-columns: 1fr minmax(260px, 300px);
        grid-template-rows: 1fr auto;
        grid-template-areas:
          "stage panel"
          "hint panel";
        gap: 12px 20px;
        padding:
          calc(14px + var(--safe-top))
          max(20px, var(--safe-right))
          calc(14px + var(--safe-bottom))
          max(20px, var(--safe-left));
      }
      .panel {
        display: flex;
        flex-direction: column;
        grid-area: panel;
        justify-content: center;
        gap: 28px;
        padding: 24px 0;
      }
      .hud-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .brand h1 { font-size: 36px; }
      .brand .sub { font-size: 11px; }
      .hud-stats {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        font-size: 15px;
      }
      .controls-bar .bar {
        flex-direction: column;
      }
      #btn-wave {
        flex: none;
        width: 100%;
        min-height: 52px;
        font-size: 16px;
      }
      #btn-pause, #btn-restart {
        width: 100%;
        min-width: 0;
        min-height: 44px;
      }
      .tower-tray {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .tray-item {
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        min-height: 64px;
        padding: 8px 14px;
      }
      .tray-item img { width: 48px; height: 48px; }
      .tray-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .hint {
        text-align: left;
        padding-left: 4px;
      }
    }

    /* ── Very wide desktop: give board even more room ── */
    @media (min-width: 1600px) {
      #app {
        grid-template-columns: 1fr minmax(280px, 340px);
        gap: 16px 32px;
        padding:
          calc(18px + var(--safe-top))
          max(32px, var(--safe-right))
          calc(18px + var(--safe-bottom))
          max(32px, var(--safe-left));
      }
      .brand h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <!-- 캠페인 맵 -->
  <div id="screen-campaign" class="screen active">
    <header class="camp-header">
      <h1>결로</h1>
      <div class="actions">
        <button id="btn-open-shop" type="button">상점</button>
      </div>
    </header>
    <div class="camp-map" id="camp-map">
      <button class="map-node" type="button" data-stage="0" id="node-0">
        <div><div class="node-title">성문 앞</div><div class="node-desc">왕국 첫 관문이에요.</div></div>
        <span class="node-stars" id="stars-0">☆☆☆</span>
      </button>
      <div class="map-connector"></div>
      <button class="map-node" type="button" data-stage="1" id="node-1" disabled>
        <div><div class="node-title">왕도</div><div class="node-desc">성으로 향하는 길이에요.</div></div>
        <span class="node-stars" id="stars-1">☆☆☆</span>
      </button>
      <div class="map-connector"></div>
      <button class="map-node" type="button" data-stage="2" id="node-2" disabled>
        <div><div class="node-title">왕성</div><div class="node-desc">마지막 방어선이에요.</div></div>
        <span class="node-stars" id="stars-2">☆☆☆</span>
      </button>
    </div>
    <p class="camp-footer">스테이지를 골라 전투에 들어가세요.</p>
  </div>

  <!-- 상점 -->
  <div id="screen-shop" class="screen">
    <header class="shop-header">
      <button id="btn-shop-back" type="button">← 맵</button>
      <h2>상점</h2>
    </header>
    <div class="shop-list">
      <div class="shop-row">
        <div><h3>광고 제거</h3><p>전투 중 방해 없이 플레이해요.</p></div>
        <span class="badge">준비 중</span>
      </div>
      <div class="shop-row">
        <div><h3>스타터 팩 (골드)</h3><p>첫 전투 골드를 늘려줘요.</p></div>
        <span class="badge">준비 중</span>
      </div>
      <div class="shop-row">
        <div><h3>광고 보고 골드 +30</h3><p>다음 전투 시작 골드가 늘어요.</p></div>
        <button id="btn-fake-ad" type="button">시청</button>
      </div>
    </div>
    <p class="shop-bonus" id="shop-bonus">보너스 골드 0</p>
  </div>

  <!-- 전투 -->
  <div id="screen-battle" class="screen">
  <div id="app">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="tower-panel"></div>
      <div id="overlay" class="hidden"></div>
    </div>
    <aside class="panel">
      <header class="hud-top">
        <div class="brand">
          <h1 id="stage-title">결로</h1>
          <span class="sub stage-label" id="stage-sub">GeomTD</span>
        </div>
        <div class="hud-stats">
          <span class="wave">웨이브 <b id="stat-wave">0</b>/8</span>
          <span class="gold">골드 <b id="stat-gold">80</b></span>
          <span class="lives">목숨 <b id="stat-lives">20</b></span>
        </div>
      </header>
      <div class="controls-bar">
        <div class="bar">
          <button id="btn-wave" type="button">다음 웨이브</button>
          <button id="btn-pause" type="button">일시정지</button>
          <button id="btn-menu" type="button" title="메뉴">⚙</button>
          <button id="btn-restart" type="button">다시</button>
        </div>
      </div>
      <div id="tower-tray" class="tower-tray">
        <button class="tray-item single" type="button" data-type="single">
          <img src="assets/tower-single.png" alt="" draggable="false" />
          <span class="tray-meta"><span class="tray-name">궁수</span><span class="tray-cost">30</span></span>
        </button>
        <button class="tray-item splash" type="button" data-type="splash">
          <img src="assets/tower-splash.png" alt="" draggable="false" />
